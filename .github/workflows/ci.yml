name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint and test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Every pin in requirements.txt has a 3.12 wheel, and the committed
          # model loads under them without version warnings.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        # No real data in CI: tests use the synthetic tests/fixtures/policies_sample.csv
        # and the committed models/claim_model.joblib.
        run: pytest

  dbt:
    name: dbt build (synthetic fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dbt.txt
      - name: Install dbt
        run: pip install -r requirements-dbt.txt
      - name: dbt build
        working-directory: dbt
        # MOTOR_CSV_PATH defaults to ../tests/fixtures/policies_sample.csv
        run: dbt build
